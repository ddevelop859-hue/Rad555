<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appwrite Realtime Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.0"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .chat-container { width: 100%; max-width: 500px; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; text-align: center; color: #38bdf8; }
        #chat-box { border: 1px solid #334155; background: #0f172a; height: 350px; overflow-y: scroll; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px; }
        .message { background: #334155; padding: 8px 12px; border-radius: 6px; word-break: break-word; font-size: 14px; }
        .input-group { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; }
        button { padding: 10px 20px; background: #0ea5e9; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0284c7; }
    </style>
</head>
<body>

    <div class="chat-container">
        <h2>Чат Appwrite</h2>
        <div id="chat-box"></div>
        <div class="input-group">
            <input type="text" id="message-input" placeholder="Введите сообщение..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Отправить</button>
        </div>
    </div>

    <script>
        // Ваши данные проекта
        const PROJECT_ID = '6aafd937003c8bd02759'; 
        const DATABASE_ID = 'Production TablesDB'; // Замените на ID базы данных, если это имя не сработает
        const COLLECTION_ID = '6aafdcfe00022f833302'; // ID таблицы messages

        const { Client, Databases, ID } = Appwrite;
        const client = new Client();

        client
            .setEndpoint('https://cloud.appwrite.io/v1')
            .setProject(PROJECT_ID);

        const databases = new Databases(client);

        // Загрузка существующих сообщений при старте
        async function loadMessages() {
            try {
                const response = await databases.listDocuments(
                    DATABASE_ID,
                    COLLECTION_ID
                );
                const chatBox = document.getElementById('chat-box');
                chatBox.innerHTML = '';
                response.documents.forEach(doc => {
                    appendMessageToDOM(doc.text);
                });
            } catch (error) {
                console.error('Ошибка загрузки сообщений:', error);
            }
        }

        // Вывод одного сообщения в блок чата
        function appendMessageToDOM(text) {
            const chatBox = document.getElementById('chat-box');
            const msgElement = document.createElement('div');
            msgElement.className = 'message';
            msgElement.textContent = text;
            chatBox.appendChild(msgElement);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Отправка нового сообщения в базу данных
        async function sendMessage() {
            const input = document.getElementById('message-input');
            const textValue = input.value.trim();

            if (!textValue) return;

            try {
                input.value = ''; // Сразу очищаем поле для удобства
                await databases.createDocument(
                    DATABASE_ID,
                    COLLECTION_ID,
                    ID.unique(),
                    { text: textValue }
                );
            } catch (error) {
                console.error('Ошибка отправки:', error);
                alert('Не удалось отправить сообщение: ' + error.message);
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // Подписка на обновление данных в реальном времени (Realtime)
        function subscribeToRealtime() {
            client.subscribe(
                `databases.${DATABASE_ID}.collections.${COLLECTION_ID}.documents`,
                response => {
                    if (response.events.includes("databases.*.collections.*.documents.*.create")) {
                        appendMessageToDOM(response.payload.text);
                    }
                }
            );
        }

        // Инициализация при запуске
        loadMessages();
        subscribeToRealtime();
    </script>
</body>
</html>
