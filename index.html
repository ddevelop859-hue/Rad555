<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Style Messenger</title>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.0"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0e1621;
            color: #f5f5f5;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 320px;
            background-color: #17212b;
            border-right: 1px solid #0e1621;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 15px;
            font-weight: bold;
            font-size: 18px;
            border-bottom: 1px solid #0e1621;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-list {
            overflow-y: auto;
            flex: 1;
        }
        .chat-item {
            padding: 12px 15px;
            display: flex;
            align-items: center;
            cursor: pointer;
            background-color: #2b5278;
        }
        .chat-item-info {
            margin-left: 10px;
        }
        .chat-item-title {
            font-weight: bold;
            font-size: 15px;
        }
        .chat-item-subtitle {
            font-size: 13px;
            color: #aaa;
            margin-top: 3px;
        }
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #0e1621;
        }
        .chat-header {
            padding: 15px;
            background-color: #17212b;
            border-bottom: 1px solid #0e1621;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 65%;
            padding: 10px 14px;
            border-radius: 12px;
            position: relative;
            word-break: break-word;
            background-color: #182533;
            color: #fff;
            align-self: flex-start;
        }
        .message.my-message {
            background-color: #2b5278;
            align-self: flex-end;
        }
        .message-delete {
            position: absolute;
            top: 5px;
            right: 8px;
            cursor: pointer;
            font-size: 12px;
            color: #aaa;
            display: none;
        }
        .message:hover .message-delete {
            display: block;
        }
        .chat-input-area {
            padding: 15px;
            background-color: #17212b;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            background-color: #242f3d;
            border: none;
            padding: 12px 15px;
            border-radius: 20px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        .btn {
            background-color: #5288c1;
            border: none;
            color: white;
            padding: 10px 16px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .btn:hover { background-color: #4072a7; }
        .error-banner {
            background-color: #cc2f2f;
            color: white;
            padding: 10px;
            text-align: center;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <span>Чаты</span>
        </div>
        <div class="chat-list">
            <div class="chat-item">
                <div class="chat-item-info">
                    <div class="chat-item-title">Общий чат Appwrite</div>
                    <div class="chat-item-subtitle">Онлайн подключение</div>
                </div>
            </div>
        </div>
    </div>

    <div class="main-chat">
        <div class="chat-header">
            <span>Общий чат</span>
        </div>

        <div id="error-banner" class="error-banner"></div>

        <div class="messages-container" id="messages-container">
            <!-- Сообщения будут подгружаться сюда -->
        </div>

        <div class="chat-input-area">
            <input type="text" id="message-input" placeholder="Введите сообщение..." onkeydown="if(event.key === 'Enter') sendMessage()">
            <button class="btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        // Ваши реальные параметры
        const PROJECT_ID = '6aafd937003c8bd02759';
        const DATABASE_ID = '6aafdcaa0014b989213e';
        const TABLE_ID = '6aafdcfe00022f833302';

        const { Client, Databases, ID } = Appwrite;
        const client = new Client();
        
        client
            .setEndpoint('https://fra.cloud.appwrite.io/v1')
            .setProject(PROJECT_ID);

        const databases = new Databases(client);

        function showError(text) {
            const banner = document.getElementById('error-banner');
            banner.textContent = text;
            banner.style.display = 'block';
        }

        // Загрузка сообщений при старте
        async function loadMessages() {
            try {
                const response = await databases.listDocuments(DATABASE_ID, TABLE_ID);
                renderMessages(response.documents);
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                showError('Ошибка загрузки: ' + error.message);
            }
        }

        function renderMessages(docs) {
            const container = document.getElementById('messages-container');
            container.innerHTML = '';
            docs.forEach(doc => {
                appendMessageToUI(doc);
            });
        }

        function appendMessageToUI(doc) {
            const container = document.getElementById('messages-container');
            const div = document.createElement('div');
            div.className = 'message';
            div.id = 'msg-' + doc.$id;
            div.innerHTML = `
                <span>${escapeHtml(doc.text || '')}</span>
                <span class="message-delete" onclick="deleteMessage('${doc.$id}')">✕</span>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        // Отправка сообщения
        async function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            try {
                input.value = '';
                await databases.createDocument(
                    DATABASE_ID,
                    TABLE_ID,
                    ID.unique(),
                    { text: text }
                );
            } catch (error) {
                console.error('Ошибка отправки:', error);
                showError('Не удалось отправить: ' + error.message);
            }
        }

        // Удаление сообщения
        async function deleteMessage(id) {
            try {
                await databases.deleteDocument(DATABASE_ID, TABLE_ID, id);
                const el = document.getElementById('msg-' + id);
                if (el) el.remove();
            } catch (error) {
                console.error('Ошибка удаления:', error);
                showError('Не удалось удалить: ' + error.message);
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Подключение Realtime для обновления в реальном времени
        try {
            client.subscribe(`databases.${DATABASE_ID}.collections.${TABLE_ID}.documents`, response => {
                if (response.events.includes(`databases.*.collections.*.documents.*.create`)) {
                    appendMessageToUI(response.payload);
                }
                if (response.events.includes(`databases.*.collections.*.documents.*.delete`)) {
                    const el = document.getElementById('msg-' + response.payload.$id);
                    if (el) el.remove();
                }
            });
        } catch (e) {
            console.error('Realtime ошибка:', e);
        }

        // Запускаем загрузку сообщений
        loadMessages();
    </script>
</body>
</html>
